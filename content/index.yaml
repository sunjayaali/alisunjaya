        - "Grafana"
        - "Prometheus"
        - "Loki"
        - "Datadog"
        - "Terraform"
    - date: "Jun, 2024 - Jul, 2025"
      title: "PT Jaya Agung Teknologi, Jakarta, Indonesia"
      role: "Backend Engineer"
      description: "Jaya Agung Teknologi is a digital application vendor focused on the gaming sector. As a Backend Engineer, I worked on backend services and third-party integrations supporting the company's gaming applications."
      highlights:
        - "Integrated five external providers that collectively contributed approximately 50% of company revenue, equivalent to around IDR 36 billion."
      tags:
        - "Go"
