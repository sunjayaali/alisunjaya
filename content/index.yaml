experience:
  title: "Experiences"
  description: "I have a diverse range of experiences in the tech industry, working on various projects and technologies. From backend development to full-stack engineering, I have contributed to the success of multiple companies and personal projects. Below is a summary of my professional journey, highlighting my roles, responsibilities, and achievements."
  items:
